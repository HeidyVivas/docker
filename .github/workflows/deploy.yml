name: Publicar Image en Docker Hub

on: 
  push:
    branches: [ "main","master" ]
    workflow_dispatch:
  
  jobs:
    test:
     runs-on ubuntu-latest
     steps:
       - name: Descargar codigo
         uses: actions/checkout@v4
       - name: Configurar Python
         uses: actions/setup-python@v5
         with:
           python-version: '3.12'

       - name: Instalar dependencias
         run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar las pruebas
        run: pytest

    build-and-push:
      runs-on: ubuntu-latest
      steps:
        - name: Descargar codigo
          uses: actions/checkout@v3

        - name: Inciar sesion en docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push backend image
          uses: docker/build-push-action@v4
          with:
            context:
            push: true
            tags: heidyvivas/mi-api:v1

        - name: Build and push frontend image
          uses: docker/build-push-action@v4
          with:
            context: ./frontend
            push: true
            tags: heidyvivas/mi-frontend:v1

        - name: Desplegar el servidor cloud
          uses: appleboy/ssh-action@v1.0.3
          with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/docker
            docker compose pull app-backend
            docker compose up -d