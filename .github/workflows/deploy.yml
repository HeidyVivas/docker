name: Publicar Image en Docker Hub
on:
  push:
    branches: ["main", "master"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run:bandit -r . -s B101 #Ignorar los archivos test

      - name: Ejecutar las pruebas
        run: pytest

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: heidyvivas/mi-api:v1

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: 'HeidyVivas/mi-api:latest'
          format: 'table'
          exit-code: '1' # Si encuentra alguna falla, rompe la ejecución
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Son los que van a detener la ejecución
        
      - name: subir imagen a Docker Hub
        run: docker push HeidyVivas/mi-api:latest

      - name: Desplegar el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/docker
            docker compose pull backend
            docker compose up -d backend
